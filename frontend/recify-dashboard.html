<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recify — Overview</title>
<style>
  :root{
    --bg:#0a0a0c; --sidebar:#101013; --card:#131317; --cardAlt:#17171c;
    --border:rgba(255,255,255,0.07); --borderSoft:rgba(255,255,255,0.04);
    --text:#f2f2f4; --textMuted:#8d8d97; --textFaint:#57575f;
    --blue:#4c7dff; --blueDim:#1c2947;
    --green:#34d399; --greenDim:#0f3b2c;
    --amber:#f5a524; --amberDim:#3d2c0c;
    --red:#f1573d; --redDim:#3a1712;
    --purple:#9b8cfb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:-apple-system,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1,"cv11" 1;
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  #app{display:flex; width:100%; min-height:100vh;}

  /* sidebar — labeled, not icon-only, for first-glance clarity */
  .sidebar{width:216px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--borderSoft);
    display:flex; flex-direction:column; padding:18px 12px 14px;}
  .brand-row{display:flex; align-items:center; gap:10px; padding:4px 6px; margin-bottom:22px;}
  .brand{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--blue),#2a4fc9);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;
    box-shadow:0 4px 14px rgba(76,125,255,0.35);}
  .brand-text .name{font-size:14px;font-weight:600;line-height:1.2;}
  .brand-text .sub{font-size:10.5px;color:var(--textFaint);line-height:1.2;}
  .side-group{display:flex;flex-direction:column;gap:3px;flex:1;}
  .side-item{
    display:flex; align-items:center; gap:11px;
    padding:9px 11px; border-radius:10px;
    color:var(--textMuted); font-size:13px; font-weight:500;
    cursor:pointer; transition:background .15s ease, color .15s ease;
    border:none; background:transparent; width:100%; text-align:left;
    font-family:inherit;
  }
  .side-item svg{flex-shrink:0;}
  .side-item:hover{color:var(--text);background:rgba(255,255,255,0.045);}
  .side-item.active{background:rgba(76,125,255,0.14);color:var(--blue);}
  .side-bottom{display:flex; flex-direction:column; gap:3px; padding-top:10px; border-top:1px solid var(--borderSoft);}

  /* shell */
  .shell{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 30px 16px;flex-shrink:0;gap:20px;}
  .page-title{font-size:22px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px;}
  .page-desc{font-size:12.5px;color:var(--textMuted);margin-top:5px;max-width:560px;line-height:1.5;}
  .live-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--textMuted);
    background:rgba(255,255,255,0.035);border:1px solid var(--borderSoft);padding:4px 9px 4px 7px;border-radius:100px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,0.18);
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .search-pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    padding:9px 14px;border-radius:100px;width:230px;color:var(--textFaint);font-size:13px;}
  .search-pill input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;
    font-family:inherit;}
  .icon-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--textMuted);cursor:pointer;position:relative;}
  .profile{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
    padding:5px 12px 5px 5px;border-radius:100px;cursor:pointer;}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(155deg,#9b8cfb,#4c7dff);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}

  .content{flex:1;overflow-y:auto;padding:4px 30px 30px;}
  .content::-webkit-scrollbar{width:8px;}
  .content::-webkit-scrollbar-thumb{background:#222227;border-radius:8px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .card-flat{background:var(--cardAlt);border:1px solid var(--borderSoft);border-radius:12px;}
  .row-3{display:grid;grid-template-columns:1.55fr 1fr 1.05fr;gap:18px;margin-top:18px;}
  .row-2{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:12px;}
  .card-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;}
  .card-sub{font-size:12px;color:var(--textMuted);margin-top:4px;line-height:1.5;}
  .muted{color:var(--textMuted);}
  .faint{color:var(--textFaint);}

  .info-tip{display:inline-flex;align-items:center;vertical-align:middle;color:var(--textFaint);
    cursor:help;margin-left:6px;opacity:.75;}
  .info-tip:hover{opacity:1;color:var(--blue);}

  .seg{display:flex;background:var(--cardAlt);border:1px solid var(--borderSoft);border-radius:100px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--textMuted);font-size:12.5px;padding:6px 13px;
    border-radius:100px;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit;}
  .seg button.on{background:var(--blue);color:#fff;}

  .delta-up{color:var(--green);background:rgba(52,211,153,0.12);}
  .delta-down{color:var(--red);background:rgba(241,87,61,0.12);}
  .delta-chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;
    padding:3px 8px 3px 6px;border-radius:100px;}

  .btn-primary{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
  .btn-ghost{background:transparent;color:var(--textMuted);border:1px solid var(--border);border-radius:10px;
    padding:8px 13px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}

  .divider{height:1px;background:var(--borderSoft);margin:14px 0;}

  .insight-banner{display:flex;gap:12px;align-items:flex-start;
    background:linear-gradient(135deg,rgba(76,125,255,0.09),rgba(76,125,255,0.02));
    border:1px solid rgba(76,125,255,0.22);border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .insight-banner.warn{border-color:rgba(245,165,36,0.25);
    background:linear-gradient(135deg,rgba(245,165,36,0.09),rgba(245,165,36,0.02));}
  .insight-banner .ico{width:30px;height:30px;border-radius:9px;background:rgba(76,125,255,0.18);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue);}
  .insight-banner.warn .ico{background:rgba(245,165,36,0.18);color:var(--amber);}
  .insight-banner .tag{font-size:10.5px;text-transform:none;color:var(--blue);font-weight:600;margin-bottom:5px;
    display:block;letter-spacing:0.01em;}
  .insight-banner.warn .tag{color:var(--amber);}

  .attn-card{margin-bottom:18px;}
  .attn-row{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--borderSoft);}
  .attn-row:last-child{border-bottom:none;}
  .attn-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .attn-text{font-size:13px;line-height:1.5;flex:1;}
  .attn-link{font-size:11.5px;color:var(--blue);font-weight:600;white-space:nowrap;flex-shrink:0;margin-top:1px;}

  .value-card{background:linear-gradient(135deg, rgba(52,211,153,0.09), rgba(76,125,255,0.05));
    border:1px solid rgba(52,211,153,0.28); border-radius:16px; padding:22px; margin-bottom:18px;}
  .value-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .value-headline{font-size:15px; font-weight:600;}
  .value-roi{font-size:12.5px; color:var(--green); font-weight:600; background:rgba(52,211,153,0.14);
    padding:5px 12px; border-radius:100px;}
  .value-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:18px;}
  .value-stat .v{font-size:23px; font-weight:700; letter-spacing:-0.02em;}
  .value-stat .l{font-size:11.5px; color:var(--textMuted); margin-top:5px; line-height:1.4;}

  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
  .kpi .label{font-size:12px;color:var(--textMuted);margin-bottom:8px;display:flex;align-items:center;}
  .kpi .value{font-size:24px;font-weight:700;letter-spacing:-0.02em;}

  table.data{width:100%;border-collapse:collapse;}
  table.data th{text-align:left;font-size:11.5px;font-weight:500;color:var(--textFaint);
    padding:0 10px 10px;border-bottom:1px solid var(--borderSoft);}
  table.data td{padding:13px 10px;font-size:13px;border-bottom:1px solid var(--borderSoft);vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:rgba(255,255,255,0.015);}

  .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;display:inline-flex;align-items:center;}

  .bar-track{height:6px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;width:100%;}
  .bar-fill{height:100%;border-radius:4px;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
  .cal-dow span{text-align:center;font-size:11px;color:var(--textFaint);}
  .cal-cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--textMuted);cursor:pointer;position:relative;border:1px solid transparent;}
  .cal-cell.pad{visibility:hidden;}
  .cal-cell:hover{background:rgba(255,255,255,0.05);}
  .cal-cell.sel{background:var(--blue);color:#fff;font-weight:600;}
  .cal-dotm{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;}
  .cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--textFaint);}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend i{width:6px;height:6px;border-radius:50%;display:inline-block;}

  .pipe-col{background:var(--cardAlt);border:1px solid var(--borderSoft);border-radius:12px;padding:12px;min-height:120px;}
  .pipe-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;}

  .scrollx{overflow-x:auto;}
  .chart-wrap{width:100%;}
  .grid-line{stroke:var(--borderSoft);stroke-width:1;}
  .tick-label{font-size:10.5px;fill:var(--textFaint);font-family:inherit;}
  svg text{font-family:-apple-system,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}

  /* ---------- global tooltip ---------- */
  #globalTooltip{position:fixed;z-index:9999;pointer-events:none;background:#0f172a;border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.6;color:#e5e7eb;box-shadow:0 10px 30px rgba(0,0,0,0.45);
    max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;}
  #globalTooltip.show{opacity:1;transform:translateY(0);}
  #globalTooltip b{color:#fff;}
  #globalTooltip .tt-row{display:flex;justify-content:space-between;gap:14px;}

  /* ---------- modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;
    padding:24px;animation:fadeIn .12s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-panel{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 24px 14px;border-bottom:1px solid var(--borderSoft);}
  .modal-title{font-size:16px;font-weight:700;}
  .modal-sub{font-size:12px;color:var(--textMuted);margin-top:5px;line-height:1.5;}
  .modal-close{background:transparent;border:none;color:var(--textFaint);cursor:pointer;padding:4px;border-radius:8px;}
  .modal-close:hover{color:var(--text);background:rgba(255,255,255,0.06);}
  .modal-body{padding:20px 24px;}
  .weight-row{margin-bottom:16px;}
  .weight-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;}
  .weight-label b{font-size:13px;}
  .weight-row input[type=range]{width:100%;accent-color:var(--blue);}
  .weight-sum{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;
    background:rgba(255,255,255,0.03);border:1px solid var(--borderSoft);font-size:12.5px;margin-top:4px;margin-bottom:20px;}
  .weight-sum.ok{color:var(--green);border-color:rgba(52,211,153,0.3);}
  .weight-sum.bad{color:var(--red);border-color:rgba(241,87,61,0.3);}
  .threshold-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12.5px;}
  .threshold-row input[type=number]{width:90px;background:var(--cardAlt);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:7px 9px;font-family:inherit;font-size:12.5px;}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px 22px;}
  .modal-note{font-size:11px;color:var(--textFaint);line-height:1.5;margin-top:4px;padding-top:14px;border-top:1px solid var(--borderSoft);}

  /* ---------- search dropdown ---------- */
  .search-wrap{position:relative;}
  .search-clear{background:transparent;border:none;color:var(--textFaint);cursor:pointer;padding:2px;display:flex;}
  .search-dd{position:absolute;top:calc(100% + 8px);left:0;width:290px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,0.45);z-index:100;overflow:hidden;}
  .search-dd-item{display:flex;flex-direction:column;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--borderSoft);}
  .search-dd-item:last-child{border-bottom:none;}
  .search-dd-item:hover{background:rgba(255,255,255,0.045);}
  .search-dd-item .t{font-size:12.5px;font-weight:600;}
  .search-dd-item .s{font-size:11px;color:var(--textFaint);margin-top:2px;}
  .search-dd-empty{padding:14px;font-size:12px;color:var(--textFaint);text-align:center;}

  /* ---------- notification dropdown ---------- */
  .notif-dd{position:absolute;top:calc(100% + 10px);right:0;width:320px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,0.45);z-index:100;overflow:hidden;}
  .notif-head{padding:13px 16px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--borderSoft);}
  .notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--borderSoft);font-size:12px;line-height:1.5;}
  .notif-item:last-child{border-bottom:none;}
  .notif-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}

  /* ---------- toast ---------- */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1f;border:1px solid var(--border);
    color:var(--text);padding:12px 20px;border-radius:12px;font-size:12.5px;box-shadow:0 16px 40px rgba(0,0,0,0.45);z-index:300;
    animation:fadeIn .15s ease;}

  /* ---------- enterprise placeholder ---------- */
  .connector-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;}
  .connector-card{background:var(--cardAlt);border:1px solid var(--borderSoft);border-radius:12px;padding:14px;}
  .connector-card .name{font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .connector-status{font-size:10.5px;font-weight:600;color:var(--amber);background:rgba(245,165,36,0.14);
    padding:3px 8px;border-radius:100px;display:inline-block;}
  table.data.disabled{opacity:0.5;}

  /* ---------- import modal ---------- */
  .privacy-banner{background:rgba(76,125,255,0.08);border:1px solid rgba(76,125,255,0.25);border-radius:10px;
    padding:12px 14px;font-size:11.5px;line-height:1.6;color:var(--textMuted);margin-bottom:18px;display:flex;gap:10px;}
  .privacy-banner .ico{color:var(--blue);flex-shrink:0;margin-top:1px;}
  .template-row{display:flex;gap:10px;margin-bottom:20px;}
  .template-link{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--cardAlt);
    border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--textMuted);
    text-decoration:none;cursor:pointer;transition:border-color .12s;}
  .template-link:hover{border-color:var(--blue);color:var(--text);}
  .dropzone{border:1.5px dashed var(--border);border-radius:12px;padding:20px 16px;text-align:center;
    cursor:pointer;margin-bottom:12px;transition:border-color .12s,background .12s;}
  .dropzone:hover, .dropzone.dragover{border-color:var(--blue);background:rgba(76,125,255,0.05);}
  .dropzone.filled{border-style:solid;border-color:rgba(52,211,153,0.4);background:rgba(52,211,153,0.05);}
  .dropzone .dz-icon{color:var(--textFaint);margin-bottom:8px;}
  .dropzone.filled .dz-icon{color:var(--green);}
  .dropzone .dz-label{font-size:12.5px;font-weight:600;margin-bottom:3px;}
  .dropzone .dz-sub{font-size:11px;color:var(--textFaint);}
  .dropzone .dz-file{font-size:12px;color:var(--text);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .import-progress{text-align:center;padding:30px 10px;}
  .import-progress .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--blue);
    border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .import-error{background:rgba(241,87,61,0.08);border:1px solid rgba(241,87,61,0.28);border-radius:10px;
    padding:11px 13px;font-size:12px;color:#f1a08e;margin-bottom:14px;line-height:1.6;}

  /* ---------- customer dossier ---------- */
  .btn-dossier{background:rgba(76,125,255,0.12);color:var(--blue);border:1px solid rgba(76,125,255,0.3);
    border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-dossier:hover{background:rgba(76,125,255,0.2);}
  .dossier-modal-panel{max-width:840px;}
  .dossier-toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--borderSoft);}
  .dossier-sheet{background:#ffffff;color:#111318;padding:34px 38px;font-size:12px;line-height:1.5;border-radius:0 0 18px 18px;}
  .dossier-sheet *{color:#111318;}
  .dossier-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111318;padding-bottom:14px;margin-bottom:18px;}
  .dossier-title{font-size:15px;font-weight:800;letter-spacing:0.3px;}
  .dossier-sub{font-size:11px;color:#5b5f6b;margin-top:4px;}
  .dossier-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .dossier-kpi{border:1px solid #d7d9df;border-radius:8px;padding:10px 12px;}
  .dossier-kpi .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:0.4px;color:#5b5f6b;margin-bottom:4px;}
  .dossier-kpi .val{font-size:16px;font-weight:800;}
  .dossier-section-title{font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.3px;}
  .dossier-table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:18px;}
  .dossier-table th{background:#111318;color:#fff;text-align:left;padding:6px 8px;font-size:9.5px;text-transform:uppercase;letter-spacing:0.3px;}
  .dossier-table td{padding:6px 8px;border-bottom:1px solid #e5e7eb;}
  .dossier-locked-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .dossier-locked-card{border:1.5px dashed #b7bac2;border-radius:10px;padding:12px 14px;background:#f7f7f9;}
  .dossier-locked-card .lock-badge{font-size:9px;font-weight:800;color:#7c4fe0;background:#efe9fe;padding:2px 7px;border-radius:100px;display:inline-block;margin-bottom:6px;}
  .dossier-locked-card .lt{font-size:11.5px;font-weight:700;margin-bottom:4px;}
  .dossier-locked-card .ld{font-size:10px;color:#5b5f6b;line-height:1.55;}
  .dossier-footnote{font-size:9px;color:#5b5f6b;border-top:1px solid #d7d9df;padding-top:10px;margin-top:8px;line-height:1.6;}

  @media print{
    body *{visibility:hidden;}
    #dossierSheet, #dossierSheet *{visibility:visible;}
    #dossierSheet{position:absolute;top:0;left:0;width:100%;margin:0;border-radius:0;padding:14mm;}
    .no-print{display:none !important;}
    @page{size:A4;margin:0;}
  }
</style>

function ICON(name, size=16, color='currentColor', extra=''){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;${extra}">${ICONS[name]||''}</svg>`;
}

function niceMax(max){
  const mag = Math.pow(10, Math.floor(Math.log10(max||1)));
  const norm = max/mag;
  let n; if(norm<=1)n=1; else if(norm<=2)n=2; else if(norm<=5)n=5; else n=10;
  return n*mag;
}

function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function jsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function barChart(data, {height=210} = {}){
  const barW=40, gap=22, leftPad=48, rightPad=10, topPad=14, botPad=26;
  const n = data.length;
  const W = leftPad + n*(barW+gap) - gap + rightPad;
  const plotH = height - topPad - botPad;
  const mx = niceMax(Math.max(...data.map(d=>d.v), 1) * 1.1);
  const ticks = [0,0.25,0.5,0.75,1].map(f=>mx*f);
  let grid = ticks.map(t=>{
    const y = topPad + plotH - (t/mx)*plotH;
    return `<line x1="${leftPad}" y1="${y}" x2="${W-rightPad}" y2="${y}" class="grid-line"/>
      <text x="${leftPad-8}" y="${y+3}" text-anchor="end" class="tick-label">${Math.round(t/1000)}k</text>`;
  }).join('');
  let bars = data.map((d,i)=>{
    const x = leftPad + i*(barW+gap);
    const h = (d.v/mx)*plotH;
    const y = topPad + plotH - h;
    const fill = d.cur ? C.blue : '#232329';
    const tip = d.tip ? ` data-tip="${esc(d.tip)}"` : '';
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="6" fill="${fill}" style="cursor:default;"${tip}></rect>
      <text x="${x+barW/2}" y="${height-6}" text-anchor="middle" class="tick-label">${d.k}</text>`;
  }).join('');
  return `<svg class="chart-wrap" viewBox="0 0 ${W} ${height}" width="100%" height="${height}" preserveAspectRatio="none">${grid}${bars}</svg>`;
}

function donutChart(segments, {size=170, thickness=22} = {}){
  const total = segments.reduce((s,a)=>s+a.value,0) || 1;
  const r = (size - thickness)/2, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  let acc = 0;
  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = `${Math.max(frac*circ - 3,0)} ${circ}`;
    const offset = -acc*circ;
    acc += frac;
    const pct = Math.round(frac*100);
    const tip = `<b>${seg.name}</b><div class="tt-row"><span>Amount</span><span>${money(seg.value)}</span></div><div class="tt-row"><span>Share</span><span>${pct}%</span></div>`;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" style="cursor:default;"
      stroke-dasharray="${dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round" data-tip="${esc(tip)}"></circle>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}

function insightBanner(icon, tag, body, level='info'){
  const warnClass = level==='info' ? '' : 'warn';
  const redStyle = level==='risk' ? 'style="border-color:rgba(241,87,61,0.28);background:linear-gradient(135deg,rgba(241,87,61,0.1),rgba(241,87,61,0.02));"' : '';
  const redIco = level==='risk' ? `style="background:rgba(241,87,61,0.18);color:${C.red};"` : '';
  const redTag = level==='risk' ? `style="color:${C.red};"` : '';
  return `<div class="insight-banner ${warnClass}" ${redStyle}>
    <div class="ico" ${redIco}>${ICON(icon,15)}</div>
    <div><span class="tag" ${redTag}>${tag}</span>${body}</div>
  </div>`;
}

/* ============================= global tooltip (delegated, works for any [data-tip]) ============================= */
function initGlobalTooltip(){
  const tip = document.createElement('div');
  tip.id = 'globalTooltip';
  document.body.appendChild(tip);
  document.addEventListener('mouseover', (e)=>{
    const el = e.target.closest('[data-tip]');
    if(!el) return;
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('show');
  });
  document.addEventListener('mousemove', (e)=>{
    if(!tip.classList.contains('show')) return;
    const pad = 16;
    let x = e.clientX + pad, y = e.clientY + pad;
    const rect = tip.getBoundingClientRect();
    if(x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - pad;
    if(y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('mouseout', (e)=>{
    if(e.target.closest('[data-tip]') && !e.relatedTarget?.closest?.('[data-tip]')){
      tip.classList.remove('show');
    }
  });
}

function showToast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function reconciliationPage(){
  const results = DATA.reconciliation.results;
  const matched = results.filter(p=>p.match_status==='matched' && !p.stale_status).length;
  const needsReview = results.filter(p=>p.match_status!=='matched' || p.stale_status).length;
  const discrepancyTotal = reconciliationDiscrepancyTotal();
  const staleCount = results.filter(p=>p.stale_status).length;

  const statusStyle = {
    matched:{c:C.green, bg:C.greenDim, label:'Matched'}, partial:{c:C.amber, bg:C.amberDim, label:'Partial'},
    overpaid:{c:C.purple, bg:'rgba(155,140,251,0.14)', label:'Overpaid'}, duplicate:{c:C.red, bg:C.redDim, label:'Duplicate'},
    unmatched:{c:C.textMuted, bg:'rgba(255,255,255,0.06)', label:'Unmatched'}
  };
  const rows = results.map(p=>{
    const s = statusStyle[p.match_status];
    let note = '';
    if(p.match_status==='partial') note = `${money(Math.abs(p.diff))} still owed on ${p.invoice.id}`;
    else if(p.match_status==='overpaid') note = `${money(p.diff)} over the invoiced amount — credit or refund`;
    else if(p.match_status==='duplicate') note = `${p.invoice.id} was already paid — likely a double-send`;
    else if(p.match_status==='unmatched') note = p.suggestion ? `No invoice "${p.invoice_ref}" — closest open match: ${p.suggestion.id} (${money(p.suggestion.amount)})` : `No matching invoice found for "${p.invoice_ref}"`;
    else if(p.stale_status) note = `Payment cleared and matches ${p.invoice.id} exactly, but the invoice status in the system still showed "${p.invoice.raw_status || p.invoice.status}" — this is now auto-corrected to Paid everywhere else in the app; this row is the audit trail of that correction.`;
    else note = `Cleanly matched to ${p.invoice.id}`;
    return `<tr>
      <td class="num muted">${p.id}</td><td style="font-weight:500;">${p.customer_name||p.customer_id}</td>
      <td class="num">${money(p.amount)}</td><td class="muted">${p.paid_date}</td>

  }).join('');

  const exc = DATA.ledgerExceptions || {credits:[], unapplied_cash:[], audit_log:[]};
  const creditsRows = exc.credits.map(c=>`<tr>
      <td style="font-weight:500;">${esc(c.customer_name||c.customer_id)}</td>

  const unappliedRows = exc.unapplied_cash.map(p=>`<tr>
      <td class="num muted">${p.id}</td><td style="font-weight:500;">${esc(p.customer_name||p.customer_id)}</td>

      <td class="muted" style="font-size:12px;">Referenced invoice "${esc(p.invoice_ref||'(blank)')}" not found${p.suggestion?` — closest match: ${p.suggestion.id} (${money(p.suggestion.amount)})`:''}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="faint" style="padding:14px 10px;">No unapplied cash — every payment matched to an invoice.</td></tr>`;

  return `

    ${insightBanner(needsReview>0?'alertTriangle':'checkCircle', 'Reconciliation',

function reconciliationDiscrepancyTotal(){
  return DATA.reconciliation.results.reduce((s,p)=>{
    if(p.match_status==='partial') return s + Math.abs(p.diff);
    if(p.match_status==='overpaid') return s + p.diff;
    if(p.match_status==='duplicate') return s + p.amount;
    if(p.match_status==='unmatched') return s + p.amount;
    return s;
  }, 0);
}

function computeAlerts(){
  const alerts = [];
  const staleCount = DATA.reconciliation.results.filter(p=>p.stale_status).length;
  if(staleCount>0){
    alerts.push({level:'warn', text:`Stale Status Alert: ${staleCount} invoice${staleCount!==1?'s':''} have settled payments but remain OPEN in the ledger.`});
  }
  const criticalDays = SETTINGS ? SETTINGS.critical_days : 60;
  const riskItems = DATA.aging.buckets.flatMap(b=>b.items).filter(i=>i.days_overdue>=criticalDays);
  const riskTotal = riskItems.reduce((s,i)=>s+i.amount,0);
  if(riskTotal>0){
    const byCust = {};
    riskItems.forEach(i=>{ byCust[i.customer_name] = (byCust[i.customer_name]||0)+i.amount; });
    const [topName, topAmt] = Object.entries(byCust).sort((a,b)=>b[1]-a[1])[0];
    const pct = Math.round(topAmt/riskTotal*100);
    if(pct>=25){
      alerts.push({level:'risk', text:`High Exposure: ${topName} accounts for ${pct}% of the ${criticalDays}+ day overdue total.`});
    }
  }
  const unallocated = reconciliationDiscrepancyTotal();
  if(unallocated>0){
    alerts.push({level:'warn', text:`Unallocated Cash: ${money(unallocated)} flagged for manual review in Reconciliation.`});
  }
  return alerts.slice(0,3);
}

function searchMatches(q){
  const query = q.trim().toLowerCase();
  if(!query) return [];
  const custMatches = DATA.customers.customers
    .filter(c=>c.name.toLowerCase().includes(query))
    .slice(0,4).map(c=>({type:'customer', label:c.name, sub:`${money(c.open_balance)} open · score ${c.score ?? '—'}/100`, key:c.name}));
  const invMatches = DATA.invoices.invoices
    .filter(i=>i.id.toLowerCase().includes(query) || i.customer_name.toLowerCase().includes(query))
    .slice(0,4).map(i=>({type:'invoice', label:i.id, sub:`${i.customer_name} · ${money(i.amount)}`, key:i.customer_name}));
  return [...custMatches, ...invMatches].slice(0,6);
}

function fmtFileSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

async function postFile(url, file, mapping){
  const fd = new FormData();
  fd.append('file', file, file.name);
  if(mapping) fd.append('mapping', JSON.stringify(mapping));
  const resp = await fetch(url, { method: 'POST', body: fd });
  let data;
  try{ data = await resp.json(); } catch(e){ data = {}; }
  if(!resp.ok) throw new Error(data.detail || `Upload to ${url} failed.`);
  return data;
}

function setupDropzone(id, onFile){
  const zone = document.getElementById(id);
  const input = document.getElementById(id + '_input');
  zone.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) onFile(input.files[0]); });
  ['dragover','dragenter'].forEach(ev=>zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.add('dragover'); }));
  ['dragleave','dragend'].forEach(ev=>zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.remove('dragover'); }));
  zone.addEventListener('drop', (e)=>{
    e.preventDefault(); zone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if(f && f.name.toLowerCase().endsWith('.csv')) onFile(f);
  });
}

function closeImportModal(){
  IMPORT.invoicesFile = null; IMPORT.paymentsFile = null; IMPORT.stage = 'form'; IMPORT.errorMsg = null;
  IMPORT.invResult = null; IMPORT.mappingTarget = null; IMPORT.mappingAnalysis = null; IMPORT.mappingChoices = {};
  STATE.modal = null;
  renderModal();
}

function openMappingWizard(kind, analysis){
  IMPORT.stage = 'mapping';
  IMPORT.mappingTarget = kind;
  IMPORT.mappingAnalysis = analysis;
  IMPORT.mappingChoices = { ...analysis.auto_mapping };
  renderImportModal(document.getElementById('modalRoot'));
}

async function confirmMapping(){
  const root = document.getElementById('modalRoot');
  const kind = IMPORT.mappingTarget;
  const file = kind === 'invoices' ? IMPORT.invoicesFile : IMPORT.paymentsFile;
  const required = kind === 'invoices'
    ? ['invoice_id','customer','amount','due_date']
    : ['payment_id','invoice_id','customer','amount_paid','payment_date'];
  const missing = required.filter(f => !IMPORT.mappingChoices[f]);
  if(missing.length){
    showToast(`Please map every required field before continuing (${missing.length} still unmapped).`);
    return;
  }
  const chosenMapping = { ...IMPORT.mappingChoices };
  IMPORT.stage = 'processing';
  IMPORT.progressText = kind === 'invoices' ? 'Parsing invoice records with your mapping...' : 'Parsing payment records with your mapping...';
  renderImportModal(root);
  try{
    const url = `/api/ingest/${kind}?reset=true`;
    const result = await postFile(url, file, chosenMapping);
    IMPORT.mappingTarget = null; IMPORT.mappingAnalysis = null; IMPORT.mappingChoices = {};
    if(kind === 'invoices'){
      IMPORT.invResult = result;
      await proceedToPayments();
    } else {
      await finishImport(IMPORT.invResult, result);
    }
  } catch(e){
    IMPORT.stage = 'form';
    IMPORT.errorMsg = e.message || 'Import failed with your mapping. Check the selected columns and try again.';
    renderImportModal(root);
  }
}

async function proceedToPayments(){
  const root = document.getElementById('modalRoot');
  IMPORT.stage = 'processing';
  IMPORT.progressText = 'Executing deterministic cash engine...';
  renderImportModal(root);
  try{
    const payResult = await postFile('/api/ingest/payments?reset=true', IMPORT.paymentsFile);
    if(payResult.needs_mapping){ openMappingWizard('payments', payResult); return; }
    await finishImport(IMPORT.invResult, payResult);
  } catch(e){
    IMPORT.stage = 'form';
    IMPORT.errorMsg = e.message || 'Import failed. Check your payments CSV and try again.';
    renderImportModal(root);
  }
}

async function finishImport(invResult, payResult){
  await loadData();
  closeImportModal();
  renderContent();
  const skipped = (invResult.skipped||0) + (payResult.skipped||0);
  const skippedNote = skipped ? ` (${skipped} row(s) skipped — unreadable amounts/dates, not guessed.)` : '';
  showToast(`Custom Ledger Processed: ${invResult.ingested} Invoices and ${payResult.ingested} Payments Active.${skippedNote}`);
}

async function runImport(){
  const root = document.getElementById('modalRoot');
  IMPORT.stage = 'processing'; IMPORT.progressText = 'Parsing records...';
  renderImportModal(root);
  try{
    const invResult = await postFile('/api/ingest/invoices?reset=true', IMPORT.invoicesFile);
    if(invResult.needs_mapping){ openMappingWizard('invoices', invResult); return; }
    IMPORT.invResult = invResult;
    await proceedToPayments();
  } catch(e){
    IMPORT.stage = 'form';
    IMPORT.errorMsg = e.message || 'Import failed. Check your CSV columns and try again.';
    renderImportModal(root);
  }
}

/*
 * Every figure here is derived from the same live DATA the rest of the
 * dashboard uses — nothing is invented for the printout. Definitions,
 * spelled out since this document leaves the app and goes into a client
 * meeting:
 *   - Total Invoiced: sum of every invoice ever raised to this customer.
 *   - Total Cleared Funds: sum of payments that reconcile to a real invoice
 *     of this customer's (matched, partial, overpaid, or duplicate — i.e.
 *     cash that genuinely arrived and is tied to a known invoice). Payments
 *     that couldn't be matched to any invoice are excluded from this figure
 *     on purpose — unverified cash isn't "cleared" yet.
 *   - Net Outstanding Exposure: the same open-balance figure used
 *     everywhere else in the app (sum of un-paid invoice amounts).
 *   - Oldest Overdue: the largest days-past-due among this customer's open
 *     invoices, computed off real due dates against today.
 */
function computeDossierData(name){
  // Single source of truth: DATA.invoices.invoices IS the backend's reconciled
  // ledger (gross_amount, paid_amount, amount=net balance, status=corrected
  // effective status) — no separate re-derivation here anymore, so this can
  // never again disagree with the Customers page or Executive Summary.
  const invoices = DATA.invoices.invoices.filter(i=>i.customer_name===name);
  const custScore = DATA.customers.customers.find(c=>c.name===name);
  const today = new Date();

  const totalInvoiced = invoices.reduce((s,i)=>s+(i.gross_amount ?? i.amount),0);
  const clearedFunds = invoices.reduce((s,i)=>s+(i.paid_amount ?? 0),0);
  const netOutstanding = custScore ? custScore.open_balance
    : invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.amount,0);

  let oldestOverdueDays = 0;
  invoices.forEach(inv=>{
    if(inv.status==='paid') return;
    const d = Math.round((today - new Date(inv.due_date))/86400000);
    if(d > oldestOverdueDays) oldestOverdueDays = d;
  });

  const rows = invoices.map(inv=>{
    const gross = inv.gross_amount ?? inv.amount;
    const pdcRef = (inv.applied_payment_ids && inv.applied_payment_ids.length) ? inv.applied_payment_ids.join(', ') : '—';
    const d = Math.round((today - new Date(inv.due_date))/86400000);
    const statusLabel = inv.status==='paid' ? 'Cleared'
      : inv.status==='partial' ? 'Partial'
      : inv.status==='disputed' ? 'Disputed'
      : d>0 ? `${d}d Overdue` : 'Current';
    return { ref: inv.id, issued: inv.issued_date, due: inv.due_date, gross, pdcRef, net: inv.amount, status: statusLabel };
  }).sort((a,b)=> new Date(a.due) - new Date(b.due));

  // Real construction data for this customer — only what's actually on file.
  const retentionRows = DATA.retention.rows.filter(r=>r.customer_name===name);
  const ipcRows = DATA.ipcVariance.rows.filter(r=>r.customer_name===name);
  const pdcRows = DATA.pdc.rows.filter(r=>r.customer_name===name);

  return { name, totalInvoiced, clearedFunds, netOutstanding, oldestOverdueDays, rows, retentionRows, ipcRows, pdcRows };
}

  const h = DATA.ledgerHealth;
  const ok = h && h.all_passed;
  const when = h ? new Date(h.checked_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const tip = h
    ? (ok ? `All 4 consistency checks passed as of ${esc(when)}.`
          : 'Checks failing:<br>' + h.checks.filter(c=>!c.pass).map(c=>'• '+esc(c.name)).join('<br>'))
    : 'Not checked yet.';
  return `<span class="live-chip" style="cursor:default;${ok?'':'color:'+C.red+';'}" data-tip="${esc(tip)}">
    <span class="live-dot" style="background:${ok?C.green:C.red};box-shadow:0 0 0 3px ${ok?'rgba(52,211,153,0.18)':'rgba(241,87,61,0.18)'};"></span>
    <span>${ok?'Reconciled':'Needs attention'}${when?' · '+when:''}</span></span>`;
}

function renderShell(){
  const sideItems = NAV.map(n=>`<button class="side-item ${STATE.view===n.id?'active':''}" data-nav="${n.id}">${ICON(n.icon,17)}<span>${n.label}</span></button>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="sidebar">
      <div class="brand-row">
        <img src="${LOGO_RECIFY}" alt="Recify" style="height:34px;width:auto;display:block;flex-shrink:0;filter:drop-shadow(0 3px 10px rgba(76,125,255,0.35));">
        <div class="brand-text"><div class="name">Recify</div><div class="sub">AR command center — live data</div></div>
      </div>
      <div class="side-group">${sideItems}</div>
      <div class="side-bottom">
        <button class="side-item" id="importBtn">${ICON('upload',17)}<span>Import Data</span></button>
        <button class="side-item" id="settingsBtn">${ICON('settings',17)}<span>Settings</span></button>
        <button class="side-item" id="logoutBtn">${ICON('logOut',17)}<span>Log out</span></button>
      </div>
    </div>
    <div class="shell">
      <div class="topbar">
        <div>
          <div class="page-title"><span id="pageTitle">${TITLES[STATE.view]}</span>
            ${dataModeChip()}${reconciledChip()}
          </div>
          <div class="page-desc" id="pageDesc">${DESCS[STATE.view]}</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <div class="search-pill">${ICON('search',14)}<input id="searchInput" placeholder="Search invoices, customers..." autocomplete="off"/>
              <button class="search-clear" id="searchClearBtn" style="display:none;">${ICON('plus',13,C.textFaint,'transform:rotate(45deg);')}</button>
            </div>
            <div class="search-dd" id="searchDd" style="display:none;"></div>
          </div>
          <div style="position:relative;">
            <button class="icon-btn" id="bellBtn">${ICON('bell',16)}<span id="bellDot" style="position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:${C.red};"></span></button>
            <div class="notif-dd" id="notifDd" style="display:none;"></div>
          </div>
          <div class="profile">
            <img src="${LOGO_KINETICS}" alt="Kinetics Group" style="height:22px;width:auto;display:block;">
            <div class="faint" style="font-size:10px;margin-left:3px;white-space:nowrap;">via Recify</div>
          </div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <div id="modalRoot"></div>`;
  renderContent();
  attachShellEvents();
}

function renderContent(){
  document.getElementById('content').innerHTML = PAGES[STATE.view]();
  document.getElementById('pageTitle').textContent = TITLES[STATE.view];
  document.getElementById('pageDesc').textContent = DESCS[STATE.view];
  applySearchFilter();
}

function attachShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.view = btn.getAttribute('data-nav');
      document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active', b===btn));
      renderContent();
    });
  });

  // search
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClearBtn');
  let debounceT;
  input.addEventListener('input', ()=>{
    STATE.search = input.value;
    clearBtn.style.display = input.value ? 'flex' : 'none';
    clearTimeout(debounceT);
    debounceT = setTimeout(()=>{
      STATE.searchOpen = true;
      renderSearchDropdown();
      applySearchFilter();
    }, 150);
  });
  input.addEventListener('focus', ()=>{ if(STATE.search){ STATE.searchOpen = true; renderSearchDropdown(); } });
  clearBtn.addEventListener('click', ()=>{
    STATE.search = ''; input.value = ''; STATE.searchOpen = false;
    clearBtn.style.display = 'none';
    renderSearchDropdown();
    applySearchFilter();
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')){ STATE.searchOpen = false; renderSearchDropdown(); }
  });

  // notifications
  const bellBtn = document.getElementById('bellBtn');
  bellBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    STATE.notifOpen = !STATE.notifOpen;
    renderNotifDropdown();
  });
  document.addEventListener('click', (e)=>{
    if(STATE.notifOpen && !e.target.closest('#notifDd') && !e.target.closest('#bellBtn')){
      STATE.notifOpen = false; renderNotifDropdown();
    }
  });

  // settings + logout
  document.getElementById('importBtn').addEventListener('click', ()=>{ STATE.modal='import'; renderModal(); });
  document.getElementById('settingsBtn').addEventListener('click', ()=>{ STATE.modal='settings'; renderModal(); });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    showToast('Demo Session: kinetics-preview. Log out disabled for evaluation instance.');
  });
}

/* ============================= boot ============================= */
document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;color:#8d8d97;font-size:13px;">Loading live data…</div>`;
initGlobalTooltip();
loadData()
  .then(renderShell)
  .catch(err => {
    document.getElementById('app').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100vh;color:#8d8d97;font-size:13px;gap:10px;">
      <div style="color:#f1573d;font-weight:600;">Could not reach the API.</div>
      <div>Make sure the backend is running: <code style="background:#17171c;padding:2px 6px;border-radius:4px;">uvicorn main:app --port 8000</code></div>
    </div>`;
    console.error(err);
  });
</script>
</body>
</html>
